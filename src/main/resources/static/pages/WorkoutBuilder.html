<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

    <title>Workout Builder - APEXION</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind-config.js"></script>

    <link href="../css/global.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Archivo+Narrow:wght@400;500;600;700&amp;family=Geist:wght@400;500;700&amp;display=swap" rel="stylesheet"/>

</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col">

<!-- Dynamic Header -->
<div id="site-header" style="min-height: 70px;"></div>

<main class="flex-1 w-full max-w-7xl mx-auto px-4 md:px-8 py-6 flex flex-col md:flex-row gap-6 h-[calc(100vh-70px)] overflow-hidden">

    <!-- Left Column -->
    <section class="flex flex-col w-full md:w-1/2 h-full bg-surface-container rounded-xl overflow-hidden border border-surface-variant shadow-lg">
        <div class="p-6 border-b border-surface-variant shrink-0">
            <h2 class="font-headline-md text-[24px] text-on-surface mb-4">Exercise Library</h2>

            <!-- Filters -->
            <div id="filter-buttons" class="flex flex-wrap gap-2">
                <button data-filter="All" class="filter-btn px-4 py-1.5 rounded-full bg-primary-container text-white font-label-md text-[14px] transition-colors border border-primary-container">All</button>
                <button data-filter="Chest" class="filter-btn px-4 py-1.5 rounded-full bg-surface-variant text-on-surface font-label-md text-[14px] transition-colors hover:bg-surface-container-high border border-surface-variant">Chest</button>
                <button data-filter="Back" class="filter-btn px-4 py-1.5 rounded-full bg-surface-variant text-on-surface font-label-md text-[14px] transition-colors hover:bg-surface-container-high border border-surface-variant">Back</button>
                <button data-filter="Shoulders" class="filter-btn px-4 py-1.5 rounded-full bg-surface-variant text-on-surface font-label-md text-[14px] transition-colors hover:bg-surface-container-high border border-surface-variant">Shoulders</button>
                <button data-filter="Arms" class="filter-btn px-4 py-1.5 rounded-full bg-surface-variant text-on-surface font-label-md text-[14px] transition-colors hover:bg-surface-container-high border border-surface-variant">Arms</button>
                <button data-filter="Core" class="filter-btn px-4 py-1.5 rounded-full bg-surface-variant text-on-surface font-label-md text-[14px] transition-colors hover:bg-surface-container-high border border-surface-variant">Core</button>
                <button data-filter="Legs" class="filter-btn px-4 py-1.5 rounded-full bg-surface-variant text-on-surface font-label-md text-[14px] transition-colors hover:bg-surface-container-high border border-surface-variant">Legs</button>
            </div>
        </div>

        <!-- Exercise List -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="exercise-library"></div>

    </section>

    <!-- Right Column -->
    <section class="flex flex-col w-full md:w-1/2 h-full bg-surface-container-low rounded-xl overflow-hidden border border-surface-variant shadow-lg relative">
        <div class="p-6 border-b border-surface-variant shrink-0 bg-surface-container">
            <h2 class="font-headline-md text-[24px] text-on-surface mb-4">Your Workout</h2>
            <input id="workout-name" class="w-full bg-surface-container-highest border border-surface-variant rounded-lg px-4 py-3 text-on-surface font-headline-md text-[20px] placeholder-on-surface-variant/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" placeholder="Workout Name (e.g. Push Day)" type="text"/>
        </div>

        <!-- Selected Exercises -->
        <div class="flex-1 overflow-y-auto p-4 bg-background" id="workout-list">
            <!-- Empty State -->
            <div class="flex flex-col items-center justify-center h-full text-center p-8 opacity-60" id="empty-state">
                <span class="material-symbols-outlined text-[64px] mb-4 text-on-surface-variant">fitness_center</span>
                <h3 class="font-headline-md text-[24px] text-on-surface mb-2">No exercises added yet</h3>
                <p class="font-body-md text-[15px] text-on-surface-variant">Select exercises from the library to build your workout.</p>
            </div>
        </div>

        <!-- Footer Action -->
        <div class="p-4 border-t border-surface-variant shrink-0 bg-surface-container">
            <button onclick="saveWorkout()" class="w-full bg-primary-container text-white font-headline-md text-[20px] py-3 rounded-lg flex items-center justify-center gap-2 hover:bg-[#c00016] transition-colors shadow-md active:scale-95">
                <span class="material-symbols-outlined">save</span>
                Save Workout
            </button>
        </div>
    </section>
</main>

<!-- Dynamic Footer -->
<div id="site-footer" style="min-height: 70px;"></div>

</body>

<script src="../js/global.js"></script>
<script src="../js/components.js"></script>
<script src="../js/workout-builder.js"></script>

</html>
