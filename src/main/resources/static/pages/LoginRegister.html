<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>Login & Register | APEXION</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind-config.js"></script>


    <link href="../css/global.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;family=Geist:wght@400;500;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@100..900&amp;family=Geist:wght@100..900&amp;family=Inter:wght@100..900&amp;display=swap"
          rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen bg-background">

<!-- Dynamic Header -->
<div id="site-header" style="min-height: 70px;"></div>

<!-- Main Container -->
<main class="flex-grow flex flex-col items-center justify-center p-6 relative z-10 w-full">
    <div class="w-full max-w-[440px] flex flex-col items-center">

        <!-- Brand Header (Outside Card) -->
        <div class="mb-8 flex flex-col items-center">
            <div class="size-12 text-primary-container mb-4">
                <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path clip-rule="evenodd"
                          d="M12.0799 24L4 19.2479L9.95537 8.75216L18.04 13.4961L18.0446 4H29.9554L29.96 13.4961L38.0446 8.75216L44 19.2479L35.92 24L44 28.7521L38.0446 39.2479L29.96 34.5039L29.9554 44H18.0446L18.04 34.5039L9.95537 39.2479L4 28.7521L12.0799 24Z"
                          fill="currentColor" fill-rule="evenodd"></path>
                </svg>
            </div>
            <h1 class="text-display-lg font-display-lg text-white text-center">Join the Apexion</h1>
            <p class="text-body-md text-secondary mt-2">Forge your future. Elevate your strength.</p>
        </div>

        <!-- Auth Card -->
        <div class="w-full bg-surface-container rounded-xl p-8 shadow-2xl">

            <!-- Tabs -->
            <div class="flex border-b border-surface-variant mb-8" id="auth-tabs">
                <button class="flex-1 py-3 text-label-md border-b-2 border-primary-container text-white transition-all"
                        id="tab-login" onclick="toggleAuth('login')">LOGIN
                </button>
                <button class="flex-1 py-3 text-label-md border-b-2 border-transparent text-secondary hover:text-white transition-all"
                        id="tab-register" onclick="toggleAuth('register')">REGISTER
                </button>
            </div>

            <!-- Login Form -->
            <form class="space-y-6 block" id="login-form">
                <!-- email -->
                <div class="space-y-2">
                    <label class="text-label-md text-on-surface-variant uppercase tracking-wider">Email Address</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary">mail</span>
                        <input class="form-input w-full bg-surface-container-low border-outline-variant rounded-lg py-3 pl-12 pr-4 text-white focus:outline-none transition-all"
                               placeholder="name@email.com" type="email">
                    </div>
                </div>
                <!-- password -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-label-md text-on-surface-variant uppercase tracking-wider">Password</label>
                        <a class="text-xs text-primary-container hover:underline" href="#">Forgot?</a>
                    </div>

                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-secondary">lock</span>
                        <input class="form-input w-full bg-surface-container-low border-outline-variant rounded-lg py-3 pl-12 pr-12 text-white focus:outline-none transition-all"
                               placeholder="••••••••" type="password">
                        <button class="absolute right-4 top-1/2 -translate-y-1/2 text-secondary hover:text-white"
                                data-icon="visibility" type="button">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- sign button -->
                <button class="w-full bg-primary-container hover:bg-inverse-primary text-white font-bold py-4 rounded-lg transition-all transform active:scale-[0.98] shadow-lg shadow-primary-container/20"
                        type="submit">
                    SIGN IN TO APEXION
                </button>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form class="space-y-6 hidden" id="register-form">
                <div class="grid grid-cols-2 gap-4">
                    <!-- first-name -->
                    <div class="space-y-2">
                        <label class="text-label-md text-on-surface-variant uppercase tracking-wider">First Name</label>
                        <input class="form-input w-full bg-surface-container-low border-outline-variant rounded-lg py-3 px-4 text-white focus:outline-none"
                               placeholder="John" type="text">
                    </div>
                    <!-- last-name -->
                    <div class="space-y-2">
                        <label class="text-label-md text-on-surface-variant uppercase tracking-wider">Last Name</label>
                        <input class="form-input w-full bg-surface-container-low border-outline-variant rounded-lg py-3 px-4 text-white focus:outline-none"
                               placeholder="Doe" type="text">
                    </div>
                </div>
                <!-- email -->
                <div class="space-y-2">
                    <label class="text-label-md text-on-surface-variant uppercase tracking-wider">Email Address</label>
                    <input class="form-input w-full bg-surface-container-low border-outline-variant rounded-lg py-3 px-4 text-white focus:outline-none"
                           placeholder="name@email.com" type="email">
                </div>
                <!-- password -->
                <div class="space-y-2">
                    <label class="text-label-md text-on-surface-variant uppercase tracking-wider">Create
                        Password</label>
                    <input class="form-input w-full bg-surface-container-low border-outline-variant rounded-lg py-3 px-4 text-white focus:outline-none"
                           placeholder="••••••••" type="password">
                </div>
                <!-- register button -->
                <button class="w-full bg-primary-container hover:bg-inverse-primary text-white font-bold py-4 rounded-lg transition-all transform active:scale-[0.98]"
                        type="submit">
                    START YOUR JOURNEY
                </button>
            </form>

            <!-- Social Login Divider -->
            <div class="relative my-8 flex items-center">
                <div class="flex-grow border-t border-surface-variant"></div>
                <span class="flex-shrink mx-4 text-xs text-on-surface-variant uppercase font-medium">Or continue with</span>
                <div class="flex-grow border-t border-surface-variant"></div>
            </div>

            <!-- Social Buttons -->
            <div class="grid grid-cols-2 gap-4">
                <button class="flex items-center justify-center gap-2 bg-surface-container-high hover:bg-surface-variant text-white py-3 rounded-lg border border-outline-variant transition-all">
                    <svg class="size-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                              fill="#4285F4"></path>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                              fill="#34A853"></path>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                              fill="#FBBC05"></path>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z"
                              fill="#EA4335"></path>
                    </svg>
                    <span class="text-sm font-medium">Google</span>
                </button>
                <button class="flex items-center justify-center gap-2 bg-surface-container-high hover:bg-surface-variant text-white py-3 rounded-lg border border-outline-variant transition-all">
                    <svg class="size-5" viewBox="0 0 256 315" xmlns="http://www.w3.org/2000/svg">
                        <path d="M213.803 167.03c.442 47.83 41.74 63.884 42.197 64.074-.335 1.104-6.585 22.643-21.716 44.713-13.076 19.069-26.635 38.082-47.994 38.468-21.002.383-27.755-12.373-51.76-12.373-24.004 0-31.517 12.01-51.378 12.776-20.612.766-36.425-20.597-49.634-39.634C6.618 240.231-11.536 172.937 13.111 130.221c12.247-21.222 34.053-34.621 57.844-34.966 18.064-.335 35.105 12.115 46.12 12.115 11.028 0 31.422-15.116 53.074-12.923 9.062.381 34.507 3.655 50.849 27.534-.1.08-.246.186-.345.289-32.906 19.344-27.245 64.76 4.15 74.76zM176.24 40.528c9.646-11.691 16.142-27.95 14.364-44.178-13.916.56-30.742 9.256-40.74 20.916-8.966 10.372-16.822 26.963-14.73 42.74 15.513 1.21 31.458-7.796 41.106-19.478z"
                              fill="currentColor"></path>
                    </svg>
                    <span class="text-sm font-medium">Apple</span>
                </button>
            </div>
        </div>

        <!-- Footer Links -->
        <div class="mt-8 flex gap-6 text-xs text-on-surface-variant font-medium">
            <a class="hover:text-white transition-colors uppercase tracking-widest" href="#">Privacy Policy</a>
            <a class="hover:text-white transition-colors uppercase tracking-widest" href="#">Terms of Service</a>
            <a class="hover:text-white transition-colors uppercase tracking-widest" href="#">Support</a>
        </div>
    </div>
</main>

<!-- Dynamic Footer -->
<div id="site-footer" style="min-height: 70px;"></div>

</body>

<script src="../js/global.js"></script>
<script src="../js/components.js"></script>
<script src="../js/login-register.js"></script>

</html>
